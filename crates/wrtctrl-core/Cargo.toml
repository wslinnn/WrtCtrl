[package]
name = "wrtctrl-core"
version = "0.1.0"
edition = "2021"
description = "WrtCtrl 核心：OpenWrt rpcd ubus 通信、会话与 UCI 写路径规则（纯 Rust，可宿主机单测）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
wiremock = "0.6"
