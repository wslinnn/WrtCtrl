[package]
name = "wrtctrl-jni"
version = "0.1.0"
edition = "2021"
description = "WrtCtrl JNI 导出层（cdylib，仅 Android 目标编译）"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# features 与 core 显式对齐（time/sync 经 core 传递虽合法但脆弱——core 调整依赖即碎）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
wrtctrl-core = { path = "../wrtctrl-core" }
