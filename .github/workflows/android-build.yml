name: android-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 自带 Android SDK（含 cmdline-tools）：接入 PATH 并预接受 license；
      # 平台与 build-tools 为小体积下载，走 sdkmanager 稳定
      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # 平台包自 2026 起带次要版本号（37.0/37.1…），裸 android-37 在仓库中不存在；
      # build-tools 不写死，AGP 按 (compileSdk, AGP 版本) 需要自动补装（license 已预接受）
      - name: Install platform
        run: sdkmanager --install "platforms;android-37.0"

      # Rust 交叉编译的 NDK 固定版本（r27b = 27.2.12479018，与 app/build.gradle.kts
      # 的 ndkVersion 一致）：专用 action 下载并缓存，规避 sdkmanager 大包安装的随机失败
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust tests
        run: cargo test -p wrtctrl-core

      - name: Static analysis & unit tests
        run: ./gradlew --no-daemon detekt testDebugUnitTest
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: wrtctrl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
