name: release

# tag（v*）推送 → 全量测试 → 签名 release 构建 → 创建 GitHub Release 并上传 APK
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # 平台包自 2026 起带次要版本号（37.0/37.1…），裸 android-37 在仓库中不存在；
      # build-tools 不写死，AGP 按 (compileSdk, AGP 版本) 需要自动补装（license 已预接受）
      - name: Install platform
        run: sdkmanager --install "platforms;android-37.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 防 tag 与 versionName 漂移：应用内检查更新按两者比较，错位会判错版本
      - name: Preflight — tag must match versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG_VERSION versionName=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 versionName ($DECLARED) 不一致：请更新 app/build.gradle.kts 后重新打 tag"
            exit 1
          fi

      - name: Rust tests
        run: cargo test -p wrtctrl-core

      - name: Static analysis & unit tests
        run: ./gradlew --no-daemon detekt testDebugUnitTest
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # 签名实体从 secrets 解到临时目录，仓库不存密码与密钥
      - name: Decode signing keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      # 混淆后的崩溃栈还原依赖 mapping；存为 artifact，不进 Release 资产
      # （应用内检查更新假定资产中有且仅有一个 .apk）
      - name: Archive R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Rename APK and compute SHA-256
        run: |
          NAME="WrtCtrl-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
